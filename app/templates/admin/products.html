

{% block content %}
<style>
    body {
        background-color: #0f172a !important;
        color: #f8fafc !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
    }

    .catalog-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px;
    }

    .catalog-container h1 {
        font-size: 2.25rem;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 2rem;
        letter-spacing: -0.025em;
    }

    .catalog-container h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 1.25rem;
    }

    .admin-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        background: #1e293b;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border: 1px solid #334155;
        margin-bottom: 32px;
    }

    .admin-form input,
    .admin-form select,
    .admin-form textarea {
        width: 100%;
        padding: 12px 16px;
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        font-size: 14px;
        color: #f8fafc;
        box-sizing: border-box;
        outline: none;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .admin-form textarea {
        grid-column: 1 / -1;
        min-height: 80px;
        resize: vertical;
    }

    .admin-form input::placeholder,
    .admin-form textarea::placeholder {
        color: #64748b;
    }

    .admin-form button {
        grid-column: 1 / -1;
        padding: 14px;
        background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .admin-form button:hover {
        opacity: 0.95;
        transform: translateY(-1px);
    }

    hr {
        border: none;
        border-top: 1px solid #334155;
        margin: 32px 0;
    }

    .products-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .product-card {
        background: #1e293b;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid #334155;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .product-card h2 {
        margin: 0 0 12px 0;
        font-size: 1.35rem;
        font-weight: 700;
    }

    .product-card h2 a {
        color: #38bdf8;
        text-decoration: none;
    }

    .product-card h2 a:hover {
        color: #7dd3fc;
    }

    .product-card p {
        margin: 8px 0;
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.5;
    }

    .product-card p.cat-tag {
        display: inline-block;
        background: #0f172a;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        font-size: 13px;
        color: #cbd5e1;
        margin-right: 12px;
    }

    .product-card p.price-tag {
        display: inline-block;
        color: #34d399;
        font-weight: 700;
        font-size: 16px;
    }

    .card-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 16px;
    }

    .btn-view {
        display: inline-flex;
        align-items: center;
        padding: 8px 16px;
        background-color: #334155;
        color: #f8fafc;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 6px;
    }

    .btn-view:hover {
        background-color: #0284c7;
        color: #ffffff;
    }

    .btn-delete {
        display: inline-flex;
        align-items: center;
        padding: 8px 16px;
        background-color: rgba(239, 68, 68, 0.1);
        color: #fca5a5;
        border: 1px solid #ef4444;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 6px;
    }

    .btn-delete:hover {
        background-color: #ef4444;
        color: #ffffff;
    }
</style>

<div class="catalog-container">
    <h1>Admin Product Management</h1>

    <h2>Add New Product</h2>

    <form action="/admin/products/create" method="post" class="admin-form">
        <input type="text" name="title" placeholder="Title" required>
        <textarea name="description" placeholder="Description" required></textarea>
        <input type="text" name="category" placeholder="Category" required>
        <input type="text" name="difficulty" placeholder="Difficulty (Beginner / Intermediate / Advanced)" required>
        <input type="text" name="language" value="English" placeholder="Language">
        <input type="number" name="duration" placeholder="Duration (hours)" required>
        <input type="number" step="0.01" name="price" placeholder="Price" required>
        <input type="text" name="instructor" placeholder="Instructor" required>
        <input type="text" name="skills" placeholder="Skills (e.g. Python, FastAPI, AI)" required>
        <input type="text" name="tags" placeholder="Tags (e.g. backend, api, recommendation)" required>
        
        <button type="submit">Create Product</button>
    </form>

    <hr>

    <h2>Existing Products</h2>

    <div class="products-list">
        {% for product in products %}
        <div class="product-card">
            <h2>
                <a href="/products/{{ product.id }}">{{ product.title }}</a>
            </h2>
            <p>{{ product.description }}</p>
            <p class="cat-tag">Category: {{ product.category }}</p>
            <p class="price-tag">Price: ₹{{ product.price }}</p>

            <div class="card-actions">
                <a href="/products/{{ product.id }}" class="btn-view">View Details</a>
                <a href="/admin/products/delete/{{ product.id }}" class="btn-delete">Delete Product</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
